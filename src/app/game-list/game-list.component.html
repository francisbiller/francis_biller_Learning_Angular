<p>game-list works!</p>
<div *ngFor="let item of gameList" [routerLink]="['/item',item.id]"[appHoverHighlight]="'red'">;
  <p>Id:{{item.id}}</p>
  <p>title: {{item | gamenames  |titlecase}}</p>
  <p>production company: {{item.productionCompany|uppercase}}</p>
  <p>Year Released: {{ item.yearReleased | date: 'fullDate' }}</p>

//

  <app-game-list-item [games]="item"></app-game-list-item>
  <img [src]="item.imageUrl" alt="{{ item.title }}"/>
  <button type="button" (click)="delete(item.id)">Delete</button>
  <button type="button" (click)="edit()">Edit</button>


</div>
